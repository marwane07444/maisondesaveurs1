<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Ultra-Luxe 24K Gold Gradient -->
    <linearGradient id="logoLuxeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0C9"/>
      <stop offset="30%" stop-color="#E5C56E"/>
      <stop offset="60%" stop-color="#C5A04D"/>
      <stop offset="100%" stop-color="#8F6E2E"/>
    </linearGradient>

    <!-- Radiant Highlights for Jewels & Curves -->
    <linearGradient id="logoLuxeShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="50%" stop-color="#E8CE7A"/>
      <stop offset="100%" stop-color="#FFF2BF"/>
    </linearGradient>

    <!-- Rich Obsidian Noir Medallion Background (Zero Green) -->
    <radialGradient id="logoLuxeNoir" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#26221D"/>
      <stop offset="70%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </radialGradient>
  </defs>

  <!-- Left: Crest Medallion (Center at x=60, y=60, r=50) -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="48" fill="url(#logoLuxeNoir)" stroke="url(#logoLuxeGold)" stroke-width="2.2"/>
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#logoLuxeGold)" stroke-width="0.8" stroke-opacity="0.7"/>
    <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#logoLuxeGold)" stroke-width="0.5" stroke-dasharray="1.5 2" stroke-opacity="0.5"/>

    <!-- Apex Star of Excellence -->
    <path d="M50 16 L51.5 20.5 L56 22 L51.5 23.5 L50 28 L48.5 23.5 L44 22 L48.5 20.5 Z" fill="url(#logoLuxeShine)"/>

    <!-- 'M' Architectural Form in Pure Ivory -->
    <path d="M28 68 V35 L50 56 L72 35 V68" stroke="#FAF8F3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24.5 35 H31.5 M68.5 35 H75.5" stroke="url(#logoLuxeGold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 68 H32 M68 68 H76" stroke="url(#logoLuxeGold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 'S' Culinary Calligraphy in 24K Gold -->
    <path d="M62 39 C55 33 44 34 40.5 42 C37 50 47.5 53.5 54 57 C61.5 61 64 66 59.5 72 C54.5 78.5 41 78 33.5 71.5" 
          stroke="#141311" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M62 39 C55 33 44 34 40.5 42 C37 50 47.5 53.5 54 57 C61.5 61 64 66 59.5 72 C54.5 78.5 41 78 33.5 71.5" 
          stroke="url(#logoLuxeShine)" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <circle cx="62" cy="39" r="1.6" fill="url(#logoLuxeGold)"/>
    <circle cx="33.5" cy="71.5" r="1.6" fill="url(#logoLuxeGold)"/>

    <!-- Laurel Sprig Base -->
    <path d="M36 76 C42 82 48 84 50 84 C52 84 58 82 64 76" stroke="url(#logoLuxeGold)" stroke-width="1" stroke-linecap="round" fill="none"/>
    <circle cx="50" cy="84" r="1.5" fill="url(#logoLuxeShine)"/>
  </g>

  <!-- Right: Sophisticated Brand Typography in Haute Luxe Palette (No Green) -->
  <g transform="translate(132, 22)">
    <!-- Primary Name: MAISON DES SAVEURS in noble warm obsidian noir -->
    <text x="0" y="38" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="30" 
          font-weight="700" 
          letter-spacing="4" 
          fill="#1A1714">
      MAISON DES SAVEURS
    </text>

    <!-- Refined Gold Divider with Central Diamond Jewel -->
    <line x1="0" y1="52" x2="368" y2="52" stroke="url(#logoLuxeGold)" stroke-width="1.2" stroke-opacity="0.85"/>
    <polygon points="184,49 187.5,52 184,55 180.5,52" fill="url(#logoLuxeShine)"/>

    <!-- Subtitle: TRAITEUR & ÉVÉNEMENTIEL • CASABLANCA -->
    <text x="0" y="69" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="4.5" 
          fill="#B89A5A">
      TRAITEUR &amp; ÉVÉNEMENTIEL
    </text>
    <text x="290" y="69" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="10.5" 
          font-weight="500" 
          letter-spacing="3" 
          fill="#757068">
      · CASABLANCA
    </text>
  </g>
</svg>
